name: Build IQPI Sudoku APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Install required Android SDK
        run: |
          command -v sdkmanager
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore standard Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
      - name: Test, lint and build installable APK
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace --continue
      - name: Summarize verification results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          lines = ["## Android verification", "| Suite | Tests | Failures | Errors |", "|---|---:|---:|---:|"]
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")):
              root = ET.parse(path).getroot()
              lines.append(f"| {root.get('name')} | {root.get('tests')} | {root.get('failures')} | {root.get('errors')} |")
              for case in root.findall('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      lines.append(f"\n{case.get('name')}: {failure.get('message')}\n")
                      print(failure.text or '')
          report = '\n'.join(lines)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(report + '\n')
          PY
      - name: Verify APK signature and metadata
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable APK
        uses: actions/upload-artifact@v5
        with:
          name: IQPI-Sudoku-POCO-X5-Pro-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Upload restored wrapper
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
