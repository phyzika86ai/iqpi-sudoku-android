name: Build IQPI Sudoku APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Install required Android SDK
        run: |
          command -v sdkmanager
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore standard Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
      - name: Test, lint and build installable APK
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and metadata
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable APK
        uses: actions/upload-artifact@v5
        with:
          name: IQPI-Sudoku-POCO-X5-Pro-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Upload restored wrapper
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
